spring.application.name=QLPT

# ===============================
# 1. CẤU HÌNH KẾT NỐI POSTGRESQL
# ===============================
# Sửa lại 'qlpt_db' thành tên database bạn đã tạo trong pgAdmin
spring.datasource.url=jdbc:postgresql://localhost:5432/qlpt_db

# Điền tài khoản và mật khẩu đăng nhập PostgreSQL của bạn
spring.datasource.username=postgres
spring.datasource.password=sagari
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# 2. CẤU HÌNH HIBERNATE / JPA
# ===============================
# update: Tự động tạo bảng, thêm cột từ các file Class Entity của bạn.
# (Rất tiện khi đang code. Khi đẩy lên server thật thì nên đổi thành 'validate' hoặc 'none')
spring.jpa.hibernate.ddl-auto=update

# Hiển thị câu lệnh SQL trên Console để dễ kiểm tra lỗi (Debug)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Báo cho Spring Boot biết bạn đang dùng PostgreSQL để nó tối ưu SQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Chuỗi bí mật để mã hóa JWT (Nên dài và bảo mật)
jwt.secret=PhanMemQuanLyPhongTroSecretKey1234567890PhanMemQuanLyPhongTroSecretKey
jwt.expiration=86400000 
# (Thời gian sống của token: 86400000 ms = 1 ngày)